name: Build Offline APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Web Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Production Web Assets
      run: npm run build --if-present

    - name: Initialize Capacitor Android Container
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps

    - name: Generate Single Logo Android Icons
      run: npx @capacitor/assets generate --android --asset-path ./assets # 👈 Explicitly points the tool to your assets folder

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # 💡 Removed the 'cache: gradle' property that was causing the file-match crash

    - name: Grant Execute Permission to Gradle
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build Android Debug APK
      run: |
        if [ -d "android" ]; then
          cd android
        fi
        ./gradlew assembleDebug

    - name: Upload Installable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HydroSense-APK
        path: |
          android/app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
