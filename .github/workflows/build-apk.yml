name: Build Offline APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Web Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Production Web Assets
      run: npm run build --if-present

    - name: Initialize Capacitor Android Container
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps

    - name: Generate Single Logo Android Icons
      run: npx @capacitor/assets generate --android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Enable AndroidX Flags Automatically
      run: |
        cd android
        # 💡 This dynamically injects the missing flag requested by the compiler error
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "Successfully injected AndroidX configuration flags!"

    - name: Grant Execute Permission to Gradle
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Installable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HydroSense-APK
        path: android/app/build/outputs/apk/debug/*.apk
