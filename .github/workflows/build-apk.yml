name: Build Android Offline APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Offline APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Production Web Assets
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Container
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init HydroSense com.hydrosense.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroSense-WaterTank-Offline-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
