    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-icon-192.png" />

    <link rel="shortcut icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

  <body class="h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register service worker for complete offline caching
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
